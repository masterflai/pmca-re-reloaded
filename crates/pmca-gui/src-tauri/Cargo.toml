[package]
name = "pmca-gui-tauri"
description = "Tauri backend for the PMCA-RE RELOADED GUI."
version = "1.1.3"
edition = "2024"
# Tauri 2.12 needs 1.90; the root workspace declares the same.
rust-version = "1.90"
license = "MIT"

# NOTE: intentionally *not* a member of the root Cargo workspace.
#
# `tauri::generate_context!` embeds the built front-end at compile time, so this
# crate only compiles after `npm install && npm run build` has produced
# `../dist`. Keeping it out of the workspace lets `cargo build --workspace`
# stay green on machines without a Node toolchain, while `cargo tauri build`
# (run from `crates/pmca-gui`) still builds the app.
[workspace]

[lib]
name = "pmca_gui_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pmca-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pmca-app = { path = "../../pmca-app" }
pmca-i18n = { path = "../../pmca-i18n" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[features]
# Keeps `cargo test` usable without a webview present.
default = []
# Embed the built front-end instead of loading `devUrl`.
#
# Without this, `generate_context!` builds a *development* context and the
# window points at the Vite dev server, so a release binary shows a connection
# error on a machine that is not running `npm run dev`. `cargo tauri build`
# passes the feature itself; a plain `cargo build --release` has to be told.
custom-protocol = ["tauri/custom-protocol"]

# Same release settings as the main workspace. This crate is a workspace of
# its own, so the root profile does not reach it.
[profile.release]
lto = true
strip = true
codegen-units = 1
