name: Camera report
description: Tell us that a camera model works (or does not) with this program.
labels: [compatibility]
body:
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware
      placeholder: ILCE-7M3, firmware 3.01
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What worked?
      options:
        - label: Camera information
        - label: Tweaks
        - label: App installation
        - label: Firmware update
        - label: Service mode / backup
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that failed, with the message shown. No serial numbers, please.
