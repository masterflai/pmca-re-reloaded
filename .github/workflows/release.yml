name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Release artefacts are built with current stable, not with the MSRV that
  # rust-toolchain.toml pins for contributors.
  RUSTUP_TOOLCHAIN: stable
  # A stalled Ubuntu mirror otherwise hangs apt without an error until the job limit.
  APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Not `ubuntu-latest`: a binary built against a newer glibc refuses
          # to start on older distributions, so the oldest supported image is
          # the widest reach. (`ubuntu-latest` also migrates to Ubuntu 26 from
          # 2026-10-19.) The GUI Linux build below is pinned for the same reason.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: pmca-console-x86_64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: pmca-console-x86_64-windows.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: pmca-console-aarch64-macos.tar.gz
          # `macos-13` was retired by GitHub; `macos-15-intel` is the current
          # x86_64 label. Cross-compiling this from the arm runner would build
          # fine but could not run the `--help` smoke test, because the arm
          # images have no Rosetta.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: pmca-console-x86_64-macos.tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install libudev (required by nusb on Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y libudev-dev

      - name: Build release binary
        run: cargo build --release --locked -p pmca-cli --target ${{ matrix.target }}

      - name: Smoke test
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/pmca-console"
          [ "${{ runner.os }}" = "Windows" ] && BIN="$BIN.exe"
          "$BIN" --help

      - name: Package
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/pmca-console.exe" staging/
          else
            cp "target/${{ matrix.target }}/release/pmca-console" staging/
          fi
          cp LICENSE.txt README.md THIRD-PARTY.md staging/
          cd staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../${{ matrix.archive }}" ./*
          else
            tar czf "../${{ matrix.archive }}" ./*
          fi

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  gui:
    name: GUI ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # The updater signing key lives in this environment's secrets, so a build
    # that produces signed updater artifacts has to run in it. The environment
    # carries a required-reviewer rule, which is the manual gate that stops a
    # single push from signing and publishing an update unreviewed.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            bundles: msi,nsis
            targets: ""
            bundle-dir: target/release/bundle
          # One universal binary instead of two builds: `lipo` puts both
          # architectures into the same .dmg, so there is one download for
          # Apple silicon and Intel alike.
          - os: macos-latest
            label: macos
            bundles: dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-target: universal-apple-darwin
            bundle-dir: target/universal-apple-darwin/release/bundle
          # Deliberately not `ubuntu-latest`: packages built against a newer
          # glibc refuse to start on older distributions, and the reverse
          # holds. The oldest supported image is therefore the widest reach.
          - os: ubuntu-22.04
            label: linux
            bundles: deb,appimage
            targets: ""
            bundle-dir: target/release/bundle
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: crates/pmca-gui/src-tauri -> ../../../target
          key: ${{ matrix.label }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libudev-dev zsync

      - name: Install frontend dependencies
        working-directory: crates/pmca-gui
        run: npm ci

      # `tauri build` runs the frontend build itself through
      # `beforeBuildCommand` and adds the `custom-protocol` feature.
      #
      # The signing key is exposed only on this step, not job-wide: it signs
      # the updater artifacts here and nothing else in the job needs it, so no
      # later action can read it. `createUpdaterArtifacts` in tauri.conf makes
      # the bundler emit a `.sig` beside each updatable bundle.
      - name: Build bundle
        working-directory: crates/pmca-gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.tauri-target && format('--target {0}', matrix.tauri-target) || '' }}

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p gui-artifacts
          # `.sig` is the updater's detached minisign signature; macOS updates
          # from the `.app.tar.gz`, not the .dmg, so both the archive and its
          # signature are collected. The .deb is managed by the system package
          # manager and is not an updater target, so it gets no signature.
          find "${{ matrix.bundle-dir }}" -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} gui-artifacts/ \;
          # An empty directory here means the bundler silently produced
          # nothing, which is easy to miss in a green log. This runs before
          # the portable archive is added, so that archive cannot mask it.
          [ -n "$(ls -A gui-artifacts)" ] || { echo "no bundle was produced"; exit 1; }

      # Tauri's AppImage carries no update information, so AppImageUpdate and
      # similar tools cannot update it. appimagetool repacks it with the address
      # of the newest release's .zsync file and writes that file. The AppImage is
      # renamed first to the name GitHub gives the asset (spaces become dots),
      # because the .zsync file refers to it by name. Tool and runtime are pinned.
      #
      # Repacking changes the AppImage's bytes, so the signature the bundler
      # wrote over the original no longer matches. The old `.sig` is dropped and
      # a fresh one is signed over the repacked file, so the updater verifies
      # exactly what it downloads.
      - name: Embed AppImage update information
        if: matrix.label == 'linux'
        shell: bash
        working-directory: gui-artifacts
        env:
          APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          APPIMAGETOOL_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          UPDATE_INFORMATION: gh-releases-zsync|masterflai|pmca-re-reloaded|latest|PMCA-RE.RELOADED_*_amd64.AppImage.zsync
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          built=(*.AppImage)
          [ "${#built[@]}" -eq 1 ] || { echo "expected one AppImage, found ${#built[@]}"; exit 1; }
          name="${built[0]// /.}"
          curl -fsSL -o /tmp/appimagetool "$APPIMAGETOOL_URL"
          curl -fsSL -o /tmp/runtime "$RUNTIME_URL"
          echo "$APPIMAGETOOL_SHA256  /tmp/appimagetool" | sha256sum -c -
          echo "$RUNTIME_SHA256  /tmp/runtime" | sha256sum -c -
          chmod +x /tmp/appimagetool "${built[0]}"
          "./${built[0]}" --appimage-extract >/dev/null
          # Drop the now-stale signature of the original image.
          rm -f "${built[0]}.sig" "$name.sig"
          rm "${built[0]}"
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run --no-appstream \
            --runtime-file /tmp/runtime -u "$UPDATE_INFORMATION" squashfs-root "$name"
          rm -rf squashfs-root
          [ -f "$name.zsync" ] || { echo "no .zsync file was written"; exit 1; }
          grep -aqF "$UPDATE_INFORMATION" "$name" || { echo "update information missing"; exit 1; }
          grep -aqxF "URL: $name" "$name.zsync" || { echo "the .zsync file names another file"; exit 1; }
          # The repacked image has to open again, not only exist.
          chmod +x "$name"
          "./$name" --appimage-extract >/dev/null
          rm -rf squashfs-root
          # Re-sign the repacked image; the CLI writes "$name.sig". The version
          # binding matches what `tauri build` put in the other artifacts' sigs.
          ver=$(jq -r .version "$GITHUB_WORKSPACE/crates/pmca-gui/src-tauri/tauri.conf.json")
          npm --prefix "$GITHUB_WORKSPACE/crates/pmca-gui" run tauri -- \
            signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            --app-version "$ver" "$PWD/$name"
          [ -f "$name.sig" ] || { echo "the repacked AppImage was not signed"; exit 1; }

      # Windows is the one platform where "portable" is not the default: both
      # bundles above install. macOS ships a .app and Linux an AppImage, which
      # already run from wherever they are put.
      #
      # The executable alone is not enough. `resolve_resource` looks for two
      # resources beside it and otherwise falls back to a compiled-in path from
      # the build machine, which exists nowhere else — the window then opens and
      # the firmware view fails with a file-not-found error naming a directory
      # the user has never seen. So they travel with it, in the same layout the
      # installers use. The enclosing directory keeps an extraction into a
      # shared folder from separating them again.
      - name: Assemble portable archive
        if: matrix.label == 'windows'
        shell: bash
        run: |
          DIR=pmca-gui-portable
          mkdir -p "$DIR"
          cp target/release/pmca-gui.exe "$DIR/"
          cp -r updatershell/bodyfs "$DIR/bodyfs"
          cp LICENSE.txt README.md THIRD-PARTY.md "$DIR/"
          # The marker tells the unpacked program it was installed by hand, so
          # `update_supported` hides the in-app updater: there is no installer
          # to replace it, and overwriting a running .exe in place would fail.
          touch "$DIR/portable.marker"
          7z a gui-artifacts/pmca-gui-portable-x86_64-windows.zip "$DIR"

      - name: Checksum
        shell: bash
        working-directory: gui-artifacts
        run: |
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pmca-gui-${{ matrix.label }}
          path: gui-artifacts/*
          if-no-files-found: error

  # Authenticode signing of the Windows downloads through SignPath.io (free for
  # open source, certificate by SignPath Foundation). Runs only once the
  # repository variable SIGNPATH_ORGANIZATION_ID is set; until then releases
  # stay unsigned. Every signing request waits for a manual approval in
  # SignPath. The artifact configuration is in .signpath/.
  sign:
    name: Sign Windows downloads
    needs: [build, gui]
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pmca-console-x86_64-windows.zip
          path: unsigned/console

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: pmca-gui-windows
          path: unsigned/gui

      - name: Collect the files to sign
        id: collect
        shell: bash
        run: |
          mkdir -p signpath-input work
          7z x unsigned/console/pmca-console-x86_64-windows.zip -owork/console
          7z x unsigned/gui/pmca-gui-portable-x86_64-windows.zip -owork
          cp work/console/pmca-console.exe work/pmca-gui-portable/pmca-gui.exe signpath-input/
          cp unsigned/gui/*.msi unsigned/gui/*-setup.exe signpath-input/
          ls -l signpath-input
          # SignPath checks the product version in every executable against this.
          msi=$(basename signpath-input/*.msi)
          version=${msi#*_}
          echo "version=${version%%_*}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned files
        id: upload-unsigned
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: signpath-input
          path: signpath-input/*
          if-no-files-found: error

      - name: Sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves room for the manual approval within the 6-hour job limit.
          wait-for-completion-timeout-in-seconds: 20000
          output-artifact-directory: signed
          parameters: |
            version: ${{ toJSON(steps.collect.outputs.version) }}

      # Same file names as the unsigned downloads, so the release job can
      # simply put these in their place.
      - name: Repackage with the signed files
        shell: bash
        run: |
          mkdir -p out
          cp signed/*.msi signed/*-setup.exe out/
          cp signed/pmca-console.exe work/console/pmca-console.exe
          (cd work/console && 7z a ../../out/pmca-console-x86_64-windows.zip ./*)
          cp signed/pmca-gui.exe work/pmca-gui-portable/pmca-gui.exe
          (cd work && 7z a ../out/pmca-gui-portable-x86_64-windows.zip pmca-gui-portable)
          cd out
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: windows-signed
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, gui, sign]
    runs-on: ubuntu-latest
    # `sign` is skipped while signing is not set up; that must not stop the release.
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v')
      && needs.build.result == 'success' && needs.gui.result == 'success'
      && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: artifacts

      # One folder per artifact. The signed Windows files replace their
      # unsigned namesakes; the input to the signing request is not published.
      - name: Assemble release files
        shell: bash
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            case "$dir" in
              artifacts/windows-signed/|artifacts/signpath-input/) ;;
              *) cp "$dir"* release/ ;;
            esac
          done
          if [ -d artifacts/windows-signed ]; then
            cp artifacts/windows-signed/* release/
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
          ls -l release

      # The updater fetches this file from the "latest" release and compares
      # its version with the running one. It is written only for final tags:
      # a pre-release is never the "latest" release the endpoint resolves to,
      # so it must not carry an updater manifest that would offer itself.
      #
      # The signature of each platform's artifact is the detached minisign
      # signature the build (or, for the AppImage, the re-sign after repacking)
      # produced; it is carried inline here, so the updater has everything it
      # needs to verify the download before running it. GitHub turns spaces in
      # an asset name into dots, so the download URL uses the dotted form.
      #
      # Windows points at the NSIS installer. While SignPath is inactive the
      # published installer is the one the bundler signed, so its signature
      # matches; enabling SignPath repackages the installer and would need its
      # updater signature refreshed too (see the sign job).
      - name: Build updater manifest
        if: ${{ !contains(github.ref_name, '-') }}
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/masterflai/pmca-re-reloaded/releases/download/${GITHUB_REF_NAME}"
          pick() {
            local m=( $1 )
            [ "${#m[@]}" -eq 1 ] || { echo "expected one match for '$1', found ${#m[@]}" >&2; return 1; }
            printf '%s' "${m[0]}"
          }
          url() { printf '%s/%s' "$base" "${1// /.}"; }
          win=$(pick '*-setup.exe')
          mac=$(pick '*.app.tar.gz')
          lin=$(pick '*.AppImage')
          for f in "$win" "$mac" "$lin"; do
            [ -f "$f.sig" ] || { echo "missing signature for $f"; exit 1; }
          done
          notes=$(awk -v v="$version" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { next }
            inside { print }
          ' "$GITHUB_WORKSPACE/CHANGELOG.md")
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg win_url "$(url "$win")" --arg win_sig "$(cat "$win.sig")" \
            --arg mac_url "$(url "$mac")" --arg mac_sig "$(cat "$mac.sig")" \
            --arg lin_url "$(url "$lin")" --arg lin_sig "$(cat "$lin.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $win_sig, url: $win_url },
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "darwin-x86_64": { signature: $mac_sig, url: $mac_url },
                "linux-x86_64": { signature: $lin_sig, url: $lin_url }
              }
            }' > latest.json
          cat latest.json

      - name: Release notes
        shell: bash
        run: |
          {
            # The section of CHANGELOG.md for this version, without its heading.
            version="${GITHUB_REF_NAME#v}"
            awk -v v="$version" '
              /^## \[/ { inside = index($0, "## [" v "]") == 1; next }
              /^\[[^]]+\]: / { next }
              inside { print }
            ' CHANGELOG.md
            cat <<'EOF'

          ### Which file do I need?

          | System | Desktop app | Command line |
          |---|---|---|
          | **Windows** (x64) | `…_x64-setup.exe` (installer) · `…_x64_en-US.msi` · `pmca-gui-portable-x86_64-windows.zip` (no installation) | `pmca-console-x86_64-windows.zip` |
          | **macOS** (Apple silicon and Intel) | `…_universal.dmg` | `pmca-console-aarch64-macos.tar.gz` · `pmca-console-x86_64-macos.tar.gz` |
          | **Linux** (x64) | `….AppImage` (portable; the `.zsync` file is for AppImageUpdate) · `…_amd64.deb` | `pmca-console-x86_64-linux.tar.gz` |

          ### Signatures

          EOF
            if [ -n "$SIGNED" ]; then
              echo 'The Windows downloads are signed. Free code signing provided by'
              echo '[SignPath.io](https://about.signpath.io/), certificate by'
              echo '[SignPath Foundation](https://signpath.org/). See the'
              echo '[code signing policy](https://github.com/masterflai/pmca-re-reloaded#code-signing-policy).'
            else
              echo 'The Windows downloads of this release are not signed. Windows shows a'
              echo 'SmartScreen warning; choose *More info* → *Run anyway*.'
            fi
            cat <<'EOF'

          macOS downloads are not signed. macOS refuses to open the app on first
          start or calls it damaged. It is not — the file carries a quarantine
          flag. Open *System Settings → Privacy & Security* and click *Open
          Anyway* (macOS 15 and later no longer offer right-click → *Open*), or run
          `xattr -dr com.apple.quarantine "/Applications/PMCA-RE RELOADED.app"`.
          Linux packages start without complaint.

          Each file has a `.sha256` beside it. That confirms the download
          arrived intact, not who produced it. Some virus scanners flag unsigned
          programs by heuristics; see
          [Signatures](https://github.com/masterflai/pmca-re-reloaded#signatures).
          EOF
          } > notes.raw
          # Release bodies render every line break, so join wrapped lines into
          # one line per paragraph or list item; headings and tables stay as they are.
          awk '
            function flush() { if (buf != "") print buf; buf = "" }
            /^```/ { flush(); code = !code; print; next }
            code { print; next }
            /^[[:space:]]*$/ { flush(); print ""; next }
            /^(#|\|)/ { flush(); print; next }
            /^([-*] |[0-9]+\. )/ { flush(); buf = $0; next }
            { line = $0; sub(/^[[:space:]]+/, "", line); buf = (buf == "") ? line : buf " " line }
            END { flush() }
          ' notes.raw > notes.md
          cat notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          name: PMCA-RE RELOADED ${{ github.ref_name }}
          # Published at once. Pre-release tags (v1.2.3-rc.1) are flagged as such
          # and never become latest; final tags do.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          # The curated CHANGELOG section replaces GitHub's commit list.
          generate_release_notes: false
          # The download table follows it in every release, because whoever
          # downloads a release rarely reads the README first, and macOS
          # phrases the quarantine flag as file corruption.
          body_path: notes.md
